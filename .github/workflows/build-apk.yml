name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle JVM and Memory
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Standalone Debug APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare installable Debug APK
        run: |
          set -e
          INPUT="android/app/build/intermediates/apk/debug/app-debug.apk"
          ALIGNED="android/app/build/outputs/apk/debug/app-debug-aligned.apk"
          FINAL="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p android/app/build/outputs/apk/debug

          test -f "$INPUT"
          echo "=== 原始 APK ==="
          ls -lh "$INPUT"

          echo "=== Zipalign APK ==="
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$INPUT" "$ALIGNED"

          echo "=== 使用 debug.keystore 簽署 APK ==="
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$FINAL" \
            "$ALIGNED"

          echo "=== 驗證 APK 簽章 ==="
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"

          echo "=== 驗證 Zipalign ==="
          "$SDK_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$FINAL"

          echo "=== 最終 APK ==="
          ls -lh "$FINAL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

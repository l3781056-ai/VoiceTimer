name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Enable Gradle Toolchain Download
        run: echo "org.gradle.java.installations.auto-download=true" >> android/gradle.properties
      - name: Build Standalone Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          _JAVA_OPTIONS: "-Xmx4096m"
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/**/*.apk

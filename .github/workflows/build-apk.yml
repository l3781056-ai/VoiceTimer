name: Build Android APK

on:
  push:
    branches: [ main, clean-stable ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove Termux-only build overrides from CI
        run: |
          sed -i '/^NODE_BINARY=/d' android/gradle.properties
          sed -i '/^android\.aapt2FromMaven=/d' android/gradle.properties
          sed -i '/^android\.injected\.build\.abi=/d' android/gradle.properties
          sed -i '/^android\.overridePathCheck=/d' android/gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle JVM and Memory
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Release and Debug APKs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APKs
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT2="$BUILD_TOOLS/aapt2"
          RELEASE="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$RELEASE"
          test -f "$DEBUG"

          echo "=== RELEASE APK ==="
          ls -lh "$RELEASE"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE"
          "$ZIPALIGN" -c 4 "$RELEASE"
          "$AAPT2" dump badging "$RELEASE" | grep -E "package:|sdkVersion:|targetSdkVersion:" || true

          echo "=== DEBUG APK (INSTALL TEST) ==="
          ls -lh "$DEBUG"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG"
          "$ZIPALIGN" -c 4 "$DEBUG"
          "$AAPT2" dump badging "$DEBUG" | grep -E "package:|sdkVersion:|targetSdkVersion:" || true

          mkdir -p android/app/build/outputs/apk/release
          cp "$RELEASE" android/app/build/outputs/apk/release/VoiceTimer-release.apk
          cp "$DEBUG" android/app/build/outputs/apk/release/VoiceTimer-debug.apk

          echo "=== SHA256 ==="
          sha256sum android/app/build/outputs/apk/release/VoiceTimer-release.apk
          sha256sum android/app/build/outputs/apk/release/VoiceTimer-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTimer-APKs
          path: |
            android/app/build/outputs/apk/release/VoiceTimer-release.apk
            android/app/build/outputs/apk/release/VoiceTimer-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APKs as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voicetimer-build-${{ github.run_number }}"
          gh release create "$TAG"             android/app/build/outputs/apk/release/VoiceTimer-debug.apk             android/app/build/outputs/apk/release/VoiceTimer-release.apk             --title "VoiceTimer Build ${{ github.run_number }}"             --notes "Clean-stable build. For phone installation testing, use VoiceTimer-debug.apk first. The release APK is included separately."

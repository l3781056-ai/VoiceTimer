name: Build Android APK

on:
  push:
    branches: [ main, clean-stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle JVM and Memory
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Standalone Release APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Gradle Release APK
        run: |
          APK="android/app/build/intermediates/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Gradle release APK not found: $APK"
            find android/app/build -type f -name "*.apk" -print
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          echo "=== APK ==="
          ls -lh "$APK"

          echo "=== Signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "=== ZIP alignment verification ==="
          "$ZIPALIGN" -v -c 4 "$APK"

          echo "=== resources.arsc ==="
          unzip -lv "$APK" | grep "resources.arsc"
          if ! unzip -lv "$APK" | grep -q "Stored.*resources.arsc"; then
            echo "ERROR: resources.arsc is compressed or missing."
            exit 1
          fi

          echo "=== Final Gradle APK is valid ==="
          mkdir -p android/app/build/outputs/apk/release
          cp "$APK" android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

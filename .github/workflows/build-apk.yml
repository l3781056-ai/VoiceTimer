name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle JVM and Memory
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Standalone Debug APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare installable Debug APK
        run: |
          set -euo pipefail
          INPUT="android/app/build/intermediates/apk/debug/app-debug.apk"
          ALIGNED="android/app/build/outputs/apk/debug/app-debug-aligned.apk"
          FINAL="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p android/app/build/outputs/apk/debug
          test -f "$INPUT"

          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$SDK_BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK_BUILD_TOOLS/apksigner"

          echo "=== Zipalign 16 KB ==="
          "$ZIPALIGN" -P 16 -f -v 4 "$INPUT" "$ALIGNED"

          echo "=== Sign APK ==="
          "$APKSIGNER" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"

          echo "=== Verify signature ==="
          "$APKSIGNER" verify --verbose --print-certs "$FINAL"

          echo "=== Verify 4-byte alignment ==="
          "$ZIPALIGN" -c -v 4 "$FINAL"

          echo "=== Verify 16 KB native-library alignment ==="
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL"

          echo "=== Verify resources.arsc is uncompressed ==="
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); i=z.getinfo("resources.arsc"); print("resources.arsc compression=",i.compress_type); assert i.compress_type==zipfile.ZIP_STORED' "$FINAL"

          echo "=== APK info ==="
          "$SDK_BUILD_TOOLS/aapt2" dump badging "$FINAL" | grep -E "package:|sdkVersion:|targetSdkVersion:"

          echo "=== SHA256 ==="
          sha256sum "$FINAL"
          ls -lh "$FINAL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

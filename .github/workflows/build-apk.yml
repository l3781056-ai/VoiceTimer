name: Build Android APK

on:
  push:
    branches: [ main, clean-stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle JVM and Memory
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Standalone Release APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign, Align and Verify Release APK
        run: |
          INPUT_APK="android/app/build/intermediates/apk/release/app-release.apk"
          OUTPUT_APK="android/app/build/outputs/apk/release/app-release-signed.apk"
          TEMP_ALIGNED="android/app/build/outputs/apk/release/app-release-aligned.apk"

          if [ ! -f "$INPUT_APK" ]; then
            echo "ERROR: Release APK input not found: $INPUT_APK"
            find android/app/build -type f -name "*.apk" -print
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Android SDK build tools are missing zipalign or apksigner."
            exit 1
          fi

          mkdir -p android/app/build/outputs/apk/release

          keytool -genkeypair \
            -keystore android/app/build/voice-timer-test.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          # Align BEFORE signing. V1 signing is disabled because adding META-INF
          # entries after zipalign can move resources.arsc off a 4-byte boundary.
          "$ZIPALIGN" -f 4 "$INPUT_APK" "$TEMP_ALIGNED"
          "$ZIPALIGN" -v -c 4 "$TEMP_ALIGNED"

          "$APKSIGNER" sign \
            --ks android/app/build/voice-timer-test.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$TEMP_ALIGNED"

          # Verify both the APK signature and the final ZIP alignment.
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK"
          "$ZIPALIGN" -v -c 4 "$OUTPUT_APK"

          if unzip -lv "$OUTPUT_APK" | grep -q "Stored.*resources.arsc"; then
            echo "=== resources.arsc is stored (uncompressed) ==="
          else
            echo "ERROR: resources.arsc is compressed or missing."
            exit 1
          fi

          rm -f "$TEMP_ALIGNED" android/app/build/voice-timer-test.keystore

          echo "=== Final signed APK ==="
          ls -lh "$OUTPUT_APK"

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7

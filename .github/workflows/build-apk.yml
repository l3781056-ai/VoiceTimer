name: Build Android APK

on:
  push:
    branches: [ clean-stable ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove Termux-only build overrides from CI
        run: |
          sed -i '/^NODE_BINARY=/d' android/gradle.properties
          sed -i '/^android\.aapt2FromMaven=/d' android/gradle.properties
          sed -i '/^android\.injected\.build\.abi=/d' android/gradle.properties
          sed -i '/^android\.overridePathCheck=/d' android/gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Gradle
        run: |
          echo "org.gradle.java.installations.paths=/usr/lib/jvm/temurin-17-jdk-amd64,/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build installable Debug APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/VoiceTimer-debug.apk
          ls -lh dist/VoiceTimer-debug.apk
          sha256sum dist/VoiceTimer-debug.apk

      - name: Verify APK (diagnostic only)
        continue-on-error: true
        run: |
          APK="dist/VoiceTimer-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -c 4000 || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTimer-debug-APK
          path: dist/VoiceTimer-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voicetimer-debug-${{ github.run_number }}"
          gh release create "$TAG"             dist/VoiceTimer-debug.apk             --title "VoiceTimer Debug Build ${{ github.run_number }}"             --notes "Clean-stable installation test build. Install VoiceTimer-debug.apk on the Android phone."
